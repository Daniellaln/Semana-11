spring:
  datasource :
    url : jdbc:mysql://localhost:3306/PETCLINIC_DB?useSSL=false&serverTimezone=UTC
    username : root
    password :

    platform : mysql
    initialization-mode : always

  jpa:
    generate-ddl : false
    hibernate.ddl-auto : none
    open-in-view : false
    show-sql : true
    properties :
      hibernate :
        dialect : org.hibernate.dialect.MySQL8Dialect

  data :
    rest :
      basePath : /api

logging :
  level :
    root : INFO
  file :
    name : ${user.home}/logs/application.log

server :
  port : 8080